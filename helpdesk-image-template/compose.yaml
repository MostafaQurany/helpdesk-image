services:
  db:
    image: mariadb:10.6
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-character-set-client-handshake
      - --skip-innodb-read-only-compressed
    environment:
      MYSQL_ROOT_PASSWORD: admin
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis-cache:
    image: redis:alpine
    volumes:
      - redis-cache-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis-queue:
    image: redis:alpine
    volumes:
      - redis-queue-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis-socketio:
    image: redis:alpine
    volumes:
      - redis-socketio-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  helpdesk-image:
    build:
      context: .
      dockerfile: Dockerfile
    image: helpdesk-custom:latest

  helpdesk-web:
    image: helpdesk-custom:latest
    depends_on:
      db:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
      redis-queue:
        condition: service_healthy
      redis-socketio:
        condition: service_healthy
    environment:
      - FRAPPE_REDIS_CACHE=redis://redis-cache:6379
      - FRAPPE_REDIS_QUEUE=redis://redis-queue:6379
      - FRAPPE_REDIS_SOCKETIO=redis://redis-socketio:6379
    # Run robust Gunicorn server specifically binding to 0.0.0.0 via its absolute virtual environment path
    command: ["/home/frappe/frappe-bench/env/bin/gunicorn", "--bind", "0.0.0.0:8000", "--threads", "4", "--workers", "2", "--worker-class", "gthread", "--worker-tmp-dir", "/dev/shm", "--timeout", "120", "--preload", "frappe.app:application"]
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
      - /home/frappe/logs
      
  helpdesk-websocket:
    image: helpdesk-custom:latest
    depends_on:
      redis-socketio:
        condition: service_healthy
    environment:
      - FRAPPE_REDIS_CACHE=redis://redis-cache:6379
      - FRAPPE_REDIS_QUEUE=redis://redis-queue:6379
      - FRAPPE_REDIS_SOCKETIO=redis://redis-socketio:6379
    command: ["node", "/home/frappe/frappe-bench/apps/frappe/socketio.js"]
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
      - /home/frappe/logs

  helpdesk-worker:
    image: helpdesk-custom:latest
    depends_on:
      db:
        condition: service_healthy
      redis-queue:
        condition: service_healthy
    environment:
      - FRAPPE_REDIS_CACHE=redis://redis-cache:6379
      - FRAPPE_REDIS_QUEUE=redis://redis-queue:6379
      - FRAPPE_REDIS_SOCKETIO=redis://redis-socketio:6379
    command: ["bench", "worker"]
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
      - /home/frappe/logs
      
  helpdesk-schedule:
    image: helpdesk-custom:latest
    depends_on:
      db:
        condition: service_healthy
      redis-queue:
        condition: service_healthy
    environment:
      - FRAPPE_REDIS_CACHE=redis://redis-cache:6379
      - FRAPPE_REDIS_QUEUE=redis://redis-queue:6379
      - FRAPPE_REDIS_SOCKETIO=redis://redis-socketio:6379
    command: ["bench", "schedule"]
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
      - /home/frappe/logs

  frontend:
    image: nginx:alpine
    depends_on:
      - helpdesk-web
      - helpdesk-websocket
    ports:
      - "8000:80"
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  db-data:
  redis-cache-data:
  redis-queue-data:
  redis-socketio-data:
  sites:
  logs:
